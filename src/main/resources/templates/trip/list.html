<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>일정 목록 | PetCheck</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/trip.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="app-shell" style="grid-template-columns: 64px 1fr;">
	<nav class="side-nav">
		<a th:href="@{/trips/new}">📍<span>일정생성</span></a>
		<a th:href="@{/trips}" class="active">📋<span>일정목록</span></a>
	</nav>

	<div class="trip-list-page">
		<div class="trip-list-header">
			<h1>내 여행 일정</h1>
			<a th:href="@{/trips/new}" class="btn-primary" style="width:auto;padding:10px 16px;">+ 일정 등록</a>
		</div>

		<div class="calendar-nav">
			<button id="prevMonth">‹</button>
			<strong id="monthLabel"></strong>
			<button id="nextMonth">›</button>
		</div>
		<div class="calendar-grid" id="calendarGrid"></div>

		<div class="trip-list-flat" id="tripFlatList"></div>
	</div>
</div>

<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/trip-common.js}"></script>
<script th:src="@{/js/trip-list.js}"></script>
</body>
</html>
