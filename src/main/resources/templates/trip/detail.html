<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>일정 상세 | PetCheck</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/trip.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="app-shell with-panel">
	<nav class="side-nav">
		<a th:href="@{/trips/new}">📍<span>일정생성</span></a>
		<a th:href="@{/trips}" class="active">📋<span>일정목록</span></a>
	</nav>

	<div class="search-panel" id="tripInfoPanel" style="border-right:none;">
		<div class="trip-panel-header">
			<div id="tripViewTitle" style="font-weight:700;font-size:16px;margin-bottom:8px;"></div>
			<button class="date-range-btn" id="editDatesBtn">📅 <span id="tripViewDates"></span> (여행 날짜 수정)</button>
			<div class="date-range-inline" id="editDatesForm" style="display:none;">
				<input type="text" id="editTitle" placeholder="여행 이름" style="flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;">
			</div>
			<div class="date-range-inline" id="editDatesInputs" style="display:none;">
				<input type="date" id="editStartDate">
				<span>~</span>
				<input type="date" id="editEndDate">
				<button id="saveDatesBtn" class="add-to-trip-btn">저장</button>
			</div>
		</div>
		<div class="trip-place-list" id="tripPlaceList" style="flex:1;"></div>
		<div class="trip-panel-footer">
			<button class="trip-delete-btn" id="deleteTripBtn" style="width:100%;padding:9px;">여행 삭제</button>
		</div>
	</div>

	<div class="panel-resize-handle" id="panelResizeHandle"></div>

	<div class="trip-map-wrap" style="grid-column: span 2;">
		<div class="date-tabs" id="dateTabs"></div>
		<div class="map-area">
			<div id="map"></div>
			<div id="mapFallback" class="map-fallback" style="display:none;"></div>
			<div id="placePopup" class="place-popup"></div>
		</div>
	</div>
</div>

<script th:inline="javascript">
	const KAKAO_JS_KEY = /*[[${kakaoJsKey}]]*/ "";
	const TRIP_ID = /*[[${tripId}]]*/ 0;
	const IS_CUSTOMER = /*[[${#authorization.expression('hasRole(''CUSTOMER'')')}]]*/ false;
</script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/map-common.js}"></script>
<script th:src="@{/js/place-popup.js}"></script>
<script th:src="@{/js/review-write.js}"></script>
<script th:src="@{/js/trip-common.js}"></script>
<script>
	PlacePopup.isLoggedIn = true;
	PlacePopup.isCustomer = IS_CUSTOMER;
</script>
<script th:src="@{/js/trip-detail.js}"></script>
</body>
</html>
