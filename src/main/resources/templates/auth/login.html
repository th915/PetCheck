<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="auth-wrap">
	<h1>로그인</h1>
	<div class="form-message error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
	<div class="form-message info" th:if="${logoutMessage}" th:text="${logoutMessage}"></div>
	<div class="form-message info" th:if="${param.signup}">회원가입이 완료되었습니다. 로그인해주세요.</div>

	<form th:action="@{/login}" method="post">
		<div class="form-group">
			<label for="email">이메일</label>
			<input type="email" id="email" name="email" required autofocus>
		</div>
		<div class="form-group">
			<label for="password">비밀번호</label>
			<input type="password" id="password" name="password" required>
		</div>
		<button type="submit" class="btn-primary">로그인</button>
	</form>
	<div class="auth-switch">
		아직 계정이 없으신가요? <a th:href="@{/signup}">회원가입</a>
	</div>
</div>
</body>
</html>
