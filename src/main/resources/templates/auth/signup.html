<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<div class="auth-wrap">
	<h1>회원가입</h1>
	<div class="form-message error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

	<form th:action="@{/signup}" method="post">
		<div class="form-group">
			<label for="email">이메일</label>
			<input type="email" id="email" name="email" required>
		</div>
		<div class="form-group">
			<label for="nickname">닉네임</label>
			<input type="text" id="nickname" name="nickname" maxlength="30" required>
		</div>
		<div class="form-group">
			<label for="password">비밀번호</label>
			<input type="password" id="password" name="password" minlength="8" maxlength="64" required>
			<div class="field-hint">8자 이상 입력해주세요.</div>
		</div>
		<div class="form-group">
			<label>가입 유형</label>
			<div class="role-choice">
				<label class="role-option">
					<input type="radio" name="role" value="CUSTOMER" checked>
					<span>고객 — 장소 검색·리뷰·일정</span>
				</label>
				<label class="role-option">
					<input type="radio" name="role" value="STORE">
					<span>사장님 — 매장 등록·인증 신청</span>
				</label>
			</div>
		</div>
		<button type="submit" class="btn-primary">회원가입</button>
	</form>
	<div class="auth-switch">
		이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
	</div>
</div>
</body>
</html>
