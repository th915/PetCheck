<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${title} + ' | PetCheck'">PetCheck</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<header class="site-header" th:fragment="header">
	<a class="brand" th:href="@{/}">🐾 PetCheck</a>
	<nav class="header-nav">
		<a th:href="@{/}">지도</a>
		<a th:href="@{/trips/new}">일정 생성</a>
		<a th:href="@{/trips}">일정 목록</a>
		<a sec:authorize="hasRole('STORE')" th:href="@{/store/dashboard}">매장 관리</a>
		<a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/stores}">관리자</a>
	</nav>
	<div class="header-auth">
		<span sec:authorize="isAuthenticated()" class="user-nickname" sec:authentication="principal.email"></span>
		<form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline-form">
			<button type="submit" class="link-btn">로그아웃</button>
		</form>
		<a sec:authorize="isAnonymous()" th:href="@{/login}">로그인</a>
		<a sec:authorize="isAnonymous()" th:href="@{/signup}">회원가입</a>
	</div>
</header>
</body>
</html>
