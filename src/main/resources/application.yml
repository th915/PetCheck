spring:
  application:
    name: petcheck-backend

  # 프로젝트 루트의 .env 파일을 설정값으로 읽어온다.
  # optional: 이므로 .env 가 없어도 기동 자체는 실패하지 않는다.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/petcheck?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: petcheck
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 개발 중: 엔티티를 고치면 테이블이 따라온다. 배포 전 validate 로 변경할 것.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
    # true 면 컨트롤러까지 DB 커넥션을 붙들고 있는다.
    # 외부 API를 실시간 호출하는 구조에서는 커넥션이 금방 마른다.
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      # 요청·응답 모두에 UTF-8 을 강제한다.
      # 브라우저가 보낸 Accept-Charset 을 무시하고 우리가 정한 값으로 내보낸다.
      force: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    # 기동 시 등록된 모든 엔드포인트를 출력한다. 매핑이 안 잡힐 때 제일 빠른 확인 방법
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: trace

app:
  # 로컬 개발용. 500 응답에 예외 원인을 담는다. 배포 전에 false 로.
  expose-error-detail: true

  # 매장 증빙 이미지 / 반려동물 사진 저장 위치
  upload:
    dir: ${user.home}/petcheck-uploads
  cors:
    allowed-origin: http://localhost:3000
  trust:
    # 신뢰도 공식의 가중치 상수 C.
    # 5 = 리뷰 5건에서 사전 점수와 실측값의 영향력이 반반이 되는 지점.
    weight: 5
    # 재계산 배치 실행 주기 (초 분 시 일 월 요일).
    # 매일 새벽 4시. 개발 중 자주 돌리고 싶으면 "0 */5 * * * *" (5분마다) 로 바꾼다.
    recalculation-cron: "0 0 4 * * *"

  review:
    # 반감기. 180일이면 6개월 지난 리뷰의 영향력이 절반이 된다.
    # 이 값을 바꾸면 저장된 누적값이 전부 무효가 되어 재구축이 필요하다.
    half-life-days: 180
    # 이보다 작은 가중치는 집계에서 뺀다 (2년 넘은 일반 리뷰 수준)
    spam-threshold: 60        # 이 점수 이상이면 Gemini 호출 없이 FAKE 확정
    min-weight: 0.05
    max-images: 5
    receipt-date-tolerance-days: 30    # 영수증 날짜와 방문일이 3일까지 어긋나도 인정
    # 작성 시 좌표가 이 반경 안이면 LOCATION 인증
    location-radius-meters: 300


    # 방문 인증 등급별 가중치
    verification-weights:
      RECEIPT: 1.0
      PHOTO_EXIF: 0.85
      LOCATION: 0.7
      SCHEDULE: 0.5
      NONE: 0.25

    # AI 진정성 판정별 가중치. FAKE 는 0 이라 분모에서도 빠진다
    authenticity-weights:
      GENUINE: 1.0
      PENDING: 0.5
      SUSPICIOUS: 0.3
      FAKE: 0.0

  jwt:
    secret: ${JWT_SECRET}
    # 리프레시 토큰 없이 액세스 토큰 하나만 쓰므로 하루로 잡는다.
    access-token-validity: 24h

    admin:
      # 로컬에서만 true. 기동 시 관리자 계정이 없으면 하나 만든다.
      # 배포 전에 false 로 바꾸고 계정 비밀번호를 교체할 것.
      bootstrap: true
      email: admin@petcheck.com
      password: admin1234!


external:
  tour-api:
    key: ${TOUR_API_KEY:}
    # 반려동물 전용 엔드포인트. 일반 관광 API(KorService2)와 다르다.
    base-url: https://apis.data.go.kr/B551011/KorPetTourService2
    # 오퍼레이션 이름이 API 버전에 따라 바뀌므로 코드가 아니라 설정에 둔다.
    detail-operation: detailPetTour2
    connect-timeout: 3s
    read-timeout: 5s

  nts:
    key: ${NTS_API_KEY:}
    base-url: https://api.odcloud.kr/api/nts-businessman/v1
  # 한국문화정보원 — 파일 데이터셋(CSV). 초기 장소 데이터의 뼈대.
  # https://www.data.go.kr/data/15111389/fileData.do
  culture-data:
    csv-path: ${user.home}/petcheck-data/culture-pet-facility.csv
    # data.go.kr 파일 데이터는 EUC-KR 인 경우가 많다. file -I 로 확인하고 바꾼다.
    charset: UTF-8

  # 식품안전나라 — 파일(xlsx). 지자체 자율 등록 목록이라
  # 새 장소를 만들지 않고 기존 장소의 publiclyRegistered 를 찍는 대조용으로만 쓴다.
  # https://www.foodsafetykorea.go.kr/portal/petKorea.do
  food-safety:
    xlsx-path: ${user.home}/petcheck-data/pet-allowed-stores.xlsx

  # 법제처 — OC 는 인증키가 아니라 신청 이메일의 ID 부분이다.
  # https://open.law.go.kr/LSO/openApi/guideList.do
  law:
    oc: ${LAW_OC:}
    base-url: https://www.law.go.kr/DRF

  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    # preview 나 *-latest 별칭을 쓰지 않는 이유: 구글이 뒤에서 모델을 바꾸면
    # 가짜 리뷰 판정 결과가 예고 없이 달라진다. 심사 기간에 그러면 곤란하다.
    model: gemini-3.8-flash
    # 주 모델이 붐빌 때(503 high demand) 자동으로 내려갈 모델
    fallback-model: gemini-2.5-flash
    connect-timeout: 5s
    # 이미지 판독은 텍스트보다 오래 걸린다
    read-timeout: 30s