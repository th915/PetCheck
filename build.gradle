plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.petcheck'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

/**
 * 소스 파일의 한글을 UTF-8 로 읽도록 고정한다.
 * 지정하지 않으면 javac 가 실행 환경의 기본 인코딩을 쓰는데,
 * 개발자마다 다르면 같은 코드가 사람에 따라 깨진 채 컴파일된다.
 */
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    querydslVersion = '5.1.0'
}

dependencies {
    // --- 웹 / API ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- 데이터 접근 ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // --- QueryDSL (Spring Boot 3 = jakarta 분류자 필수) ---
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // --- 외부 API / 캐시 ---
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'com.opencsv:opencsv:5.9'

    // 사진 EXIF 에서 촬영 시각·GPS 추출
    implementation 'com.drewnoakes:metadata-extractor:2.19.0'

    // --- 인증/인가 ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // --- 개발 편의 ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // --- 테스트 ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/**
 * 기본 테스트 — DB 없이 도는 것만 돈다.
 * integration 태그가 붙은 테스트는 로컬 MySQL 을 요구하므로 제외한다.
 */
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

/**
 * 로컬 MySQL 이 떠 있을 때만 실행하는 테스트.
 *   ./gradlew integrationTest
 */
tasks.register('integrationTest', Test) {
    description = '로컬 MySQL 이 필요한 테스트 (QueryDSL 검색 등)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

// QueryDSL Q타입이 build/generated 아래에 생성된다.
// clean 할 때 옛 Q타입이 남아 충돌하는 것을 막는다.
clean {
    delete file('src/main/generated')
}

tasks.named('bootRun') {
    jvmArgs('-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8')
}
